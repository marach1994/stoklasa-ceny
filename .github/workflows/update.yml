name: Denní aktualizace marží

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stáhnout a spočítat marže
        run: python mamtex_marze.py

      - name: Commit a push změn
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Aktualizace marží ${{ github.run_id }}"
          file_pattern: 'marze_export.csv'
